# Theme for the demo (app.py). Navy primary on a light ground; serif headings, Plex body.
[theme]
base = "light"
primaryColor = "#1e3a5f"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#e9eef5"
textColor = "#0f172a"
borderColor = "#cbd5e1"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap"
baseFontSize = 16

[server]
headless = true

[browser]
gatherUsageStats = false
